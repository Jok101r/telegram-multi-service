version: "3.8"

services:
  whisper-service:
    # https://github.com/openai/whisper
    build: ./whisper-service
    environment:
      - WHISPER_MODEL=small   # tiny/base/small/medium/large-v3/distil-large-v3
      - WHISPER_DEVICE=cpu    # cpu or cuda (if a GPU runner is available)
      - WHISPER_COMPUTE_TYPE=int8  # int8 (fast on CPU) / float16 (for GPU)
    volumes:
      - whisper-cache:/root/.cache/huggingface   # faster-whisper caches models via huggingface_hub
    restart: unless-stopped

  image-gen-service:
    # Image generation via Stable Diffusion v1.5 (Apache 2.0)
    # IMAGE_MODEL can be replaced with "Lykon/dreamshaper-8" or "SG161222/Realistic_Vision_V5.1"
    build: ./image-gen-service
    environment:
      - IMAGE_MODEL=Lykon/dreamshaper-8
      - IMAGE_LORA=latent-consistency/lcm-lora-sdv1-5
      - IMAGE_STEPS=8
      - IMAGE_GUIDANCE_SCALE=1.5
      - IMAGE_WIDTH=512
      - IMAGE_HEIGHT=512
    volumes:
      - image-gen-cache:/root/.cache/huggingface   # model cache (~4 GB)
    restart: unless-stopped

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped

  video-dl-service:
    build: ./video-dl-service
    ports:
      - "8002:8002"                 # exposed for direct download links (files > 50 MB)
    environment:
      - RATE_LIMIT_DELAY=5          # seconds between requests (anti-ban)
      - PROXY_URL=                  # optional: socks5://host:port or http://host:port
      - COOKIES_FILE=/cookies/cookies.txt
      - POT_PROVIDER_URL=http://pot-provider:4416
      - PUBLIC_URL=http://192.168.1.101:8002  # public URL for download links (change to your server IP/domain)
      - FILE_TTL_SECONDS=600        # how long download links stay valid (10 min)
    depends_on:
      - pot-provider
    volumes:
      - video-dl-cache:/root/.cache
      - ./cookies.txt:/cookies/cookies.txt
    tmpfs:
      - /tmp:size=6G               # temp storage for large video downloads + FFmpeg merge
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot-java
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WHISPER_SERVICE_URL=http://whisper-service:8000/transcribe
      - IMAGE_GEN_SERVICE_URL=http://image-gen-service:8001/generate
      - VIDEO_DL_SERVICE_URL=http://video-dl-service:8002
    depends_on:
      - whisper-service
      - image-gen-service
      - video-dl-service
    restart: unless-stopped

volumes:
  whisper-cache:
  image-gen-cache:
  video-dl-cache:
